openapi: 3.1.0
info: {title: ATLAS API, version: 0.1.0}
paths:
  /api/v1/targets:
    get: {summary: List active targets, responses: {'200': {description: OK}}}
    post: {summary: Create target and initial scope, responses: {'201': {description: Created}, '400': {description: Validation error}}}
  /api/v1/targets/{id}:
    get: {summary: Get target profile, responses: {'200': {description: OK}, '404': {description: Not found}}}
    patch: {summary: Update or archive target, responses: {'200': {description: OK}}}
  /api/v1/targets/{id}/scope:
    get: {summary: List scope rules, responses: {'200': {description: OK}}}
    put: {summary: Replace scope rules, responses: {'200': {description: OK}}}
  /api/v1/targets/{id}/runs:
    get: {summary: List collection runs, responses: {'200': {description: OK}}}
    post: {summary: Queue a collection run, responses: {'202': {description: Accepted}, '400': {description: Invalid or unauthorized request}}}
  /api/v1/runs/{id}:
    get: {summary: Inspect collection run, responses: {'200': {description: OK}}}
  /api/v1/runs/{id}/cancel:
    post: {summary: Cancel a running collection run, responses: {'202': {description: Accepted}}}
  /api/v1/runs/{id}/events:
    get: {summary: Stream persisted collection progress over SSE, responses: {'200': {description: Event stream}}}
  /api/v1/targets/{id}/entities:
    get:
      summary: List target assets
      parameters:
        - {name: type, in: query, schema: {type: string}, description: Optional entity type filter}
        - {name: scopeStatus, in: query, schema: {type: string, enum: [included, excluded, unknown]}, description: Optional scope classification filter}
        - {name: investigationStatus, in: query, schema: {type: string}, description: Optional investigation-state filter}
        - {name: q, in: query, schema: {type: string}, description: Search normalized asset values}
      responses: {'200': {description: OK}}
  /api/v1/targets/{id}/entities/{entityId}:
    get: {summary: Inspect an asset including canonical value and metadata, responses: {'200': {description: OK}, '404': {description: Not found}}}
  /api/v1/targets/{id}/entities/{entityId}/investigation:
    patch: {summary: Set an asset investigation status or bookmark, responses: {'200': {description: OK}, '400': {description: Validation error}}}
  /api/v1/targets/{id}/entities/{entityId}/relationships:
    get: {summary: List bounded evidence-backed relationships for an asset, responses: {'200': {description: OK}}}
  /api/v1/targets/{id}/entities/{entityId}/observations:
    get: {summary: List observation history for an asset, responses: {'200': {description: OK}}}
  /api/v1/targets/{id}/graph:
    get: {summary: Return a bounded graph neighborhood for entityId, responses: {'200': {description: OK}, '400': {description: entityId required}}}
  /api/v1/targets/{id}/relationships:
    post: {summary: Create an evidence-rationalized manual relationship or hypothesis, responses: {'201': {description: Created}, '400': {description: Validation error}}}
  /api/v1/targets/{id}/observations:
    get: {summary: List target observations, responses: {'200': {description: OK}}}
    post: {summary: Create a manual observation, responses: {'201': {description: Created}, '400': {description: Validation error}}}
  /api/v1/targets/{id}/snapshots:
    get: {summary: List target snapshots, responses: {'200': {description: OK}}}
    post: {summary: Create a named manual snapshot, responses: {'201': {description: Created}}}
  /api/v1/targets/{id}/snapshots/compare:
    get: {summary: Compare two target snapshots using from and to query parameters, responses: {'200': {description: OK}}}
  /api/v1/targets/{id}/evidence/{evidenceId}:
    get: {summary: Retrieve retained, unexecuted evidence content and provenance, responses: {'200': {description: OK}, '404': {description: Not found}}}
